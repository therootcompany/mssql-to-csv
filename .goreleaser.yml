version: 2

builds:
  - env:
      - CGO_ENABLED=0
    main: ./main.go
    binary: mssql-to-csv
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip